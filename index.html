<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4ee">
  <title>일정관리챗봇</title>
  <meta name="description" content="일정을 추가하고 확인·수정·삭제하는 일정관리챗봇">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261010-14">
</head>
<body>
  <div class="shell">
    <aside class="side-panel" aria-label="서비스 정보">
      <a class="brand" href="#" aria-label="일정관리챗봇 홈">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>일정관리챗봇</span>
      </a>

      <section id="sideCalendar" class="side-calendar" aria-label="월간 일정 캘린더"></section>
      <section id="sideDayEventsPanel" class="side-events-panel" aria-label="선택한 날짜의 일정">
        <p class="side-day-events-empty">캘린더에서 날짜를 선택하세요.</p>
      </section>
      <div class="today-card">
        <span id="sideMonth">10월</span>
        <strong id="sideDay">09</strong>
        <p id="sideWeekday">금요일</p>
        <div class="today-count"><b id="todayCount">0</b>개의 일정이 있어요</div>
      </div>
      <button id="trashButton" class="side-trash-button" type="button"><span aria-hidden="true">▤</span> 휴지통 <small id="trashCount">0</small></button>
      <button id="calendarButton" class="side-calendar-button" type="button">▦ 캘린더</button>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <span class="bot-avatar small" aria-hidden="true">✦</span>
          <div><strong>일정관리챗봇</strong></div>
        </div>
        <button id="resetButton" class="icon-button" type="button" title="처음으로" aria-label="대화를 처음으로 되돌리기">↻</button>
      </header>

      <section id="chat" class="chat" aria-live="polite" aria-label="일정 챗봇 대화"></section>

    </main>
  </div>

  <div id="calendarModal" class="calendar-modal" role="dialog" aria-modal="true" aria-label="전체 일정 캘린더" hidden>
    <div class="calendar-dialog">
      <button id="calendarClose" class="calendar-close" type="button" aria-label="캘린더 닫기">×</button>
      <div id="calendarMount"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20261010-14"></script>
</body>
</html>
